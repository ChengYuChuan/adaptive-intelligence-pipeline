[project]
name = "adaptive-intelligence-pipeline"
version = "0.4.0"
description = "Switchable-component AI information integration system with RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Yu-Chuan Cheng" }
]

dependencies = [
    # Core Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    
    # LLM Providers
    "anthropic>=0.39.0",
    "boto3>=1.35.0",
    "openai>=1.12.0",
    
    # Data Sources
    "arxiv>=2.1.0",
    "newsapi-python>=0.2.7",
    "httpx>=0.27.0",
    
    # Output Adapters
    "aiosmtplib>=3.0.0",
    
    # RAG System (Week 3)
    "chromadb>=0.4.22",
    "pymupdf>=1.23.8",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.6",
    "tiktoken>=0.5.2",
    
    # Week 4 - Production Infrastructure
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 關鍵修正：明確指定 app 目錄
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app/",
    "data/",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"