[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CRITICAL FIX: Add project root to Python path
# This fixes: ModuleNotFoundError: No module named 'app'
pythonpath = .

addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -ra

markers =
    integration: marks tests as integration tests requiring real API calls (deselect with '-m "not integration"')
    unit: marks tests as unit tests (default, no marker needed)
    slow: marks tests as slow (>1 second)
    api: marks tests that make external API calls
    requires_aws: marks tests requiring AWS credentials
    requires_newsapi: marks tests requiring NewsAPI key
    requires_anthropic: marks tests requiring Anthropic API key
    requires_smtp: marks tests requiring SMTP configuration

# Asyncio configuration
# Fixes: PytestDeprecationWarning about asyncio_default_fixture_loop_scope
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function