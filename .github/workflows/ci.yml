name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs when a new workflow with the same group name starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false  # Continue testing other versions even if one fails
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests (no external API calls)
      env:
        # Set dummy values for required config (will be mocked in tests)
        ANTHROPIC_API_KEY: sk-ant-test-key-for-ci
        NEWSAPI_KEY: test-newsapi-key
        AWS_ACCESS_KEY_ID: test-aws-key
        AWS_SECRET_ACCESS_KEY: test-aws-secret
        SMTP_USERNAME: test@example.com
        SMTP_PASSWORD: test-password
      run: |
        pytest app/tests/ -v \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing \
          -m "not integration" \
          --tb=short
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests-${{ matrix.python-version }}
        name: codecov-umbrella-${{ matrix.python-version }}
        fail_ci_if_error: false  # Don't fail CI if Codecov upload fails

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort mypy
    
    - name: Run ruff (fast linter)
      run: |
        ruff check app/ --output-format=github
      continue-on-error: false
    
    - name: Check code formatting with black
      run: |
        black --check app/ --diff
      continue-on-error: false
    
    - name: Check import sorting with isort
      run: |
        isort --check-only app/ --diff
      continue-on-error: false
    
    - name: Run mypy type checking (optional)
      run: |
        mypy app/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # Type checking failures don't fail CI (yet)

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check for known security vulnerabilities in dependencies
      run: |
        safety check --json || true
      continue-on-error: true
    
    - name: Run Bandit security linter
      run: |
        bandit -r app/ -f json -o bandit-report.json || true
        cat bandit-report.json
      continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: aip:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        # Start container with dummy environment variables
        docker run -d -p 8000:8000 --name aip-test \
          -e ANTHROPIC_API_KEY=sk-ant-test-key \
          -e LLM_PROVIDER=claude \
          -e SOURCE_PROVIDER=arxiv \
          -e OUTPUT_PROVIDER=console \
          aip:test
        
        # Wait for service to be ready
        echo "Waiting for service to start..."
        sleep 15
        
        # Test health endpoint
        echo "Testing health endpoint..."
        curl -f http://localhost:8000/health || exit 1
        
        # Test OpenAPI docs endpoint
        echo "Testing OpenAPI docs..."
        curl -f http://localhost:8000/docs || exit 1
        
        # Show logs if tests fail
        if [ $? -ne 0 ]; then
          echo "Container logs:"
          docker logs aip-test
          exit 1
        fi
        
        # Cleanup
        docker stop aip-test
        docker rm aip-test

  # Optional: Integration tests (only run manually or on specific branches)
  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run integration tests (with real API calls)
      env:
        # These should be set as GitHub Secrets
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      run: |
        pytest app/tests/ -v \
          -m "integration" \
          --tb=short \
          || echo "Integration tests skipped (no API keys)"
      continue-on-error: true

  # Dependency check job
  dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Check for outdated dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        pip-audit --desc || true
      continue-on-error: true

  # Summary job that requires all critical jobs to pass
  ci-success:
    runs-on: ubuntu-latest
    needs: [test, lint, docker]
    if: always()
    
    steps:
    - name: Check if all critical jobs succeeded
      run: |
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Tests failed"
          exit 1
        fi
        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "Linting failed"
          exit 1
        fi
        if [ "${{ needs.docker.result }}" != "success" ]; then
          echo "Docker build/test failed"
          exit 1
        fi
        echo "All critical jobs passed!"